[versions]
agp = "8.8.2"
coilCompose = "3.3.0"
constraintlayoutCompose = "1.1.1"
converterGson = "3.0.0"
koinAndroid = "4.1.0"
koinAndroidxCompose = "4.1.0"
kotlin = "2.2.0"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
kotlinxCoroutinesTest = "1.10.2"
